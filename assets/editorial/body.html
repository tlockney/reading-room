<script>
(function(){
  if(window.__edzoom)return; window.__edzoom=true;
  var overlay,stage,content,pct,scale=1,tx=0,ty=0,drag=null,pointers=new Map(),pinch=null;
  function apply(){content.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';pct.textContent=Math.round(scale*100)+'%';}
  function clamp(s){return Math.max(0.4,Math.min(12,s));}
  function reset(){scale=1;tx=0;ty=0;apply();}
  function zoomBy(f){scale=clamp(scale*f);apply();}
  function build(){
    overlay=document.createElement('div');overlay.className='edzoom-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','Zoomed figure');
    stage=document.createElement('div');stage.className='edzoom-stage';
    content=document.createElement('div');content.className='edzoom-content';
    stage.appendChild(content);overlay.appendChild(stage);
    var ctr=document.createElement('div');ctr.className='edzoom-controls';
    ctr.innerHTML='<button data-z="out" aria-label="Zoom out">&#8722;</button><span class="edzoom-pct">100%</span><button data-z="in" aria-label="Zoom in">+</button><button data-z="reset">Reset</button><button data-z="close">Close</button>';
    overlay.appendChild(ctr);pct=ctr.querySelector('.edzoom-pct');
    document.body.appendChild(overlay);
    ctr.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;e.stopPropagation();var z=b.getAttribute('data-z');if(z==='in')zoomBy(1.3);else if(z==='out')zoomBy(1/1.3);else if(z==='reset')reset();else if(z==='close')close();});
    overlay.addEventListener('click',function(e){if(e.target===overlay||e.target===stage)close();});
    stage.addEventListener('wheel',function(e){e.preventDefault();var f;if(e.ctrlKey){f=Math.exp(-e.deltaY*0.01);f=Math.max(0.7,Math.min(1.4,f));}else{f=Math.exp(-e.deltaY*0.0015);f=Math.max(0.85,Math.min(1.18,f));}zoomBy(f);},{passive:false});
    var ptDist=function(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);};
    var ptList=function(){return Array.from(pointers.values());};
    stage.addEventListener('pointerdown',function(e){
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      try{stage.setPointerCapture(e.pointerId);}catch(_){}
      if(pointers.size===1){drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty};stage.classList.add('dragging');}
      else{drag=null;var p=ptList();pinch={d:ptDist(p[0],p[1]),cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};}
    });
    stage.addEventListener('pointermove',function(e){
      if(!pointers.has(e.pointerId))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size>=2&&pinch){
        var p=ptList(),nd=ptDist(p[0],p[1]),ncx=(p[0].x+p[1].x)/2,ncy=(p[0].y+p[1].y)/2;
        if(pinch.d>0)scale=clamp(scale*(nd/pinch.d));
        tx+=ncx-pinch.cx;ty+=ncy-pinch.cy;pinch={d:nd,cx:ncx,cy:ncy};apply();
      }else if(drag){tx=drag.tx+(e.clientX-drag.x);ty=drag.ty+(e.clientY-drag.y);apply();}
    });
    var endPt=function(e){
      pointers.delete(e.pointerId);
      if(pointers.size<2)pinch=null;
      if(pointers.size===0){drag=null;stage.classList.remove('dragging');}
      else if(pointers.size===1){var q=ptList()[0];drag={x:q.x,y:q.y,tx:tx,ty:ty};}
    };
    stage.addEventListener('pointerup',endPt);
    stage.addEventListener('pointercancel',endPt);
    stage.addEventListener('dblclick',function(e){e.preventDefault();if(scale>1.05)reset();else zoomBy(2.4);});
    document.addEventListener('keydown',function(e){if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();else if(e.key==='+'||e.key==='=')zoomBy(1.3);else if(e.key==='-')zoomBy(1/1.3);else if(e.key==='0')reset();});
  }
  function open(vis){content.innerHTML='';content.appendChild(vis.cloneNode(true));reset();overlay.classList.add('open');document.documentElement.classList.add('edzoom-open');document.documentElement.style.overflow='hidden';}
  function close(){overlay.classList.remove('open');document.documentElement.classList.remove('edzoom-open');document.documentElement.style.overflow='';content.innerHTML='';pointers.clear();pinch=null;drag=null;}
  function visIn(el){return el.querySelector('svg, img, canvas');}
  function targetVisual(t){
    if(t.closest && t.closest('.edzoom-overlay'))return null;
    var host=t.closest && t.closest('figure, pre.mermaid, div.mermaid');
    if(host){var v=visIn(host);if(v)return v;}
    if(t.tagName==='IMG')return t;
    return null;
  }
  function mark(){
    document.querySelectorAll('figure, pre.mermaid, div.mermaid').forEach(function(el){
      if(el.classList.contains('edzoom-marked'))return;
      if(!visIn(el))return;
      el.classList.add('edzoom-marked','edzoom-able'); /* hint is CSS ::after */
    });
  }
  function init(){
    build();mark();
    document.addEventListener('click',function(e){var v=targetVisual(e.target);if(v){e.preventDefault();open(v);}});
    try{new MutationObserver(mark).observe(document.body,{childList:true,subtree:true});}catch(_){}
  }
  if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
})();
</script>
<button class="edtheme" type="button" aria-label="Toggle dark mode">Dark</button>
<script>
(function(){
  if(window.__edtheme)return;window.__edtheme=true;
  var root=document.documentElement;
  if(root.getAttribute('data-ed-theme')==='off')return;
  var KEY='editorial-theme';
  function label(){var b=document.querySelector('.edtheme');if(b)b.textContent=(root.getAttribute('data-theme')==='dark')?'Light':'Dark';}
  label();
  var b=document.querySelector('.edtheme');
  if(b)b.addEventListener('click',function(){var n=(root.getAttribute('data-theme')==='dark')?'light':'dark';root.setAttribute('data-theme',n);label();try{localStorage.setItem(KEY,n);}catch(_){}});
})();
</script>
<button class="edpaged-toggle" type="button" aria-label="Toggle paged reading">Paged</button>
<script>
(function(){
  if(window.__edpaged)return;
  var root=document.documentElement;
  /* Pure paging math, exposed for the Deno test suite (paged_test.ts). */
  var P={
    /* page index holding absolute x-offset `x` when pages are `w` wide */
    pageOf:function(x,w){return w>0?Math.max(0,Math.floor((x+1)/w)):0;},
    /* page count from the multicol scroll width */
    count:function(scrollWidth,w){return w>0?Math.max(1,Math.round(scrollWidth/w)):1;},
    /* where a drag of dx px (positive = finger moved right) at vx px/ms lands */
    snap:function(page,dx,w,vx,count){
      var t=page;
      if(dx<=-w*0.2||vx<=-0.5)t=page+1;else if(dx>=w*0.2||vx>=0.5)t=page-1;
      return Math.max(0,Math.min(count-1,t));
    },
    /* position memory: last id-bearing mark at/before `page` plus pages past it */
    anchorFor:function(marks,page){
      var m=null;
      for(var i=0;i<marks.length;i++){if(marks[i].page<=page)m=marks[i];else break;}
      return m?{id:m.id,delta:page-m.page}:{id:null,delta:page};
    },
    /* the page an anchor resolves to against a fresh set of marks */
    restore:function(marks,saved,count){
      var base=0,d=(saved&&typeof saved.delta==='number')?saved.delta:0;
      if(saved&&saved.id){for(var i=0;i<marks.length;i++){if(marks[i].id===saved.id){base=marks[i].page;break;}}}
      return Math.max(0,Math.min(count-1,base+d));
    }
  };
  window.__edpaged=P;
  if(root.getAttribute('data-ed-paged')==='off')return;
  var KEY='editorial-paged',POS,body,toggle,count,rule,mq;
  var page=0,pages=1,w=0,anchor=null,timer=null,pd=null,dragged=false;
  function on(){return root.getAttribute('data-ed-paged')==='on';}
  function pref(){var s=null;try{s=localStorage.getItem(KEY);}catch(_){}return s==='on';}
  function xOf(el){return el.getBoundingClientRect().left+body.scrollLeft;}
  function marks(){
    var out=[],els=body.querySelectorAll('h1[id],h2[id],h3[id],h4[id],section[id]');
    for(var i=0;i<els.length;i++)out.push({id:els[i].id,page:P.pageOf(xOf(els[i]),w)});
    return out;
  }
  function measure(){w=body.clientWidth||window.innerWidth;pages=P.count(body.scrollWidth,w);}
  function show(){
    count.textContent='§ '+(page+1)+' / '+pages;
    rule.style.width=(pages>1?(page/(pages-1))*100:100)+'%';
  }
  function remember(){anchor=P.anchorFor(marks(),page);try{localStorage.setItem(POS,JSON.stringify(anchor));}catch(_){}}
  function go(n,smooth){
    page=Math.max(0,Math.min(pages-1,n));
    body.scrollTo({left:page*w,top:0,behavior:smooth?'smooth':'auto'});
    show();remember();
  }
  /* Once the scroller is at rest: square up to a page boundary (the body is a
     real scroll container now, so a stray native scroll can leave it between
     pages) and nudge a repaint, which iOS WebKit otherwise skips for columns
     far from the origin, leaving a settled page blank. */
  var settleTimer=null;
  function settle(){
    if(!on()||pd||w<=0)return;
    var n=Math.max(0,Math.min(pages-1,Math.round(body.scrollLeft/w)));
    if(Math.abs(body.scrollLeft-n*w)>1)body.scrollTo({left:n*w,top:0,behavior:'auto'});
    if(n!==page){page=n;show();remember();}
    body.style.visibility='hidden';void body.offsetHeight;body.style.visibility='';
  }
  function scheduleSettle(){clearTimeout(settleTimer);settleTimer=setTimeout(settle,160);}
  function saved(){try{var s=localStorage.getItem(POS);return s?JSON.parse(s):null;}catch(_){return null;}}
  function hashTarget(){
    if(!location.hash)return null;
    try{return document.getElementById(decodeURIComponent(location.hash.slice(1)));}catch(_){return null;}
  }
  function label(){if(toggle)toggle.textContent=on()?'Scroll':'Paged';}
  function enter(){
    var at=null;
    if(window.scrollY>10){at=document.elementFromPoint(window.innerWidth/2,100);}
    root.setAttribute('data-ed-paged','on');measure();
    var h=hashTarget(),s=saved();
    if(h)go(P.pageOf(xOf(h),w),false);
    else if(at&&at!==body)go(P.pageOf(xOf(at),w),false);
    else go(s?P.restore(marks(),s,pages):0,false);
    label();
  }
  function leave(){
    var a=anchor;
    root.removeAttribute('data-ed-paged');body.scrollTo({left:0,top:0});
    if(a&&a.id){var el=document.getElementById(a.id);if(el)el.scrollIntoView();}
    label();
  }
  function relayout(){if(!on())return;measure();go(P.restore(marks(),anchor,pages),false);}
  function schedule(){if(!on())return;clearTimeout(timer);timer=setTimeout(relayout,120);}
  function endDrag(e){
    if(!pd)return;var d=pd;pd=null;
    if(!d.move)return;
    dragged=true;setTimeout(function(){dragged=false;},60);
    var dx=e.clientX-d.x,vx=dx/Math.max(1,Date.now()-d.t);
    go(P.snap(page,dx,w,vx,pages),true);
  }
  function init(){
    body=document.body;POS='editorial-paged-pos:'+location.pathname;
    toggle=document.querySelector('.edpaged-toggle');
    count=document.createElement('div');count.className='edpaged-count';count.setAttribute('aria-live','polite');
    rule=document.createElement('div');rule.className='edpaged-rule';rule.setAttribute('aria-hidden','true');
    body.appendChild(count);body.appendChild(rule);
    mq=window.matchMedia?matchMedia('(max-width:720px),(pointer:coarse) and (orientation:portrait)'):null;
    if(on()){measure();var h=hashTarget(),s=saved();go(h?P.pageOf(xOf(h),w):(s?P.restore(marks(),s,pages):0),false);}
    label();
    if(toggle)toggle.addEventListener('click',function(){
      if(on()){leave();try{localStorage.setItem(KEY,'off');}catch(_){}}
      else{try{localStorage.setItem(KEY,'on');}catch(_){}enter();}
    });
    if(mq){var onMq=function(){if(!pref())return;if(mq.matches){if(!on())enter();}else if(on())leave();};
      if(mq.addEventListener)mq.addEventListener('change',onMq);else if(mq.addListener)mq.addListener(onMq);}
    document.addEventListener('click',function(e){
      if(!on()||!e.target.closest)return;
      var a=e.target.closest('a[href^="#"]');
      if(a){
        var id='';try{id=decodeURIComponent(a.getAttribute('href').slice(1));}catch(_){}
        var el=id&&document.getElementById(id);
        if(el){e.preventDefault();go(P.pageOf(xOf(el),w),true);try{history.replaceState(null,'','#'+id);}catch(_){}}
        return;
      }
      if(dragged)return;
      if(e.target.closest('a,button,input,textarea,select,summary,label,.edzoom-able,pre,table,.edzoom-overlay'))return;
      var x=e.clientX/w;
      if(x<0.3)go(page-1,true);else if(x>0.7)go(page+1,true);
    });
    body.addEventListener('pointerdown',function(e){
      if(!on()||(e.pointerType==='mouse'&&e.button!==0))return;
      pd={x:e.clientX,y:e.clientY,t:Date.now(),sl:body.scrollLeft,move:false};
    });
    body.addEventListener('pointermove',function(e){
      if(!pd)return;
      var dx=e.clientX-pd.x,dy=e.clientY-pd.y;
      if(!pd.move){if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy))return;pd.move=true;}
      body.scrollLeft=pd.sl-dx;
    });
    body.addEventListener('pointerup',endDrag);
    body.addEventListener('pointercancel',function(){if(pd&&pd.move)go(page,true);pd=null;});
    document.addEventListener('keydown',function(e){
      if(!on()||root.classList.contains('edzoom-open'))return;
      var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
      if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(page+1,true);
      else if(e.key==='ArrowLeft'||e.key==='PageUp')go(page-1,true);
      else return;
      e.preventDefault();
    });
    body.addEventListener('scroll',scheduleSettle,{passive:true});
    window.addEventListener('resize',schedule);
    window.addEventListener('load',schedule);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
    try{new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){var t=ms[i].target;if(t.closest&&t.closest('.edpaged-count,.edpaged-rule,.edzoom-overlay'))continue;schedule();return;}
    }).observe(body,{childList:true,subtree:true});}catch(_){}
  }
  if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
})();
</script>
